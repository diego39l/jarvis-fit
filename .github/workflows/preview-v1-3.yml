name: Jarvis Fit 1.3 — preview isolada
on:
  workflow_dispatch:
  push:
    branches: [feat/jarvis-fit-v1-3]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Guardar prévia sem publicar na produção
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-fit-1-3-preview
          path: dist/
          retention-days: 14
